[package]
name = "op4-core"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Post-quantum cryptography (RustCrypto)
ml-kem           = { version = "0.2.3", features = ["zeroize"] }
ml-dsa           = { version = "0.1.0-rc.8", features = ["zeroize"] }

# Classical cryptography — stable 2.x series
x25519-dalek     = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
ed25519-dalek    = { version = "2.1.1", features = ["rand_core", "zeroize"] }

# Symmetric crypto
chacha20poly1305 = "0.10.1"
hkdf             = "0.12.4"
hmac             = "0.12.1"
sha2             = "0.10.8"
argon2           = "0.5.3"
zeroize          = { version = "1.8.2", features = ["derive", "serde"] }

# Serialization (minimal, no_std-friendly)
serde            = { version = "1.0.197", features = ["derive"] }
postcard         = { version = "1.1.3", features = ["alloc"] }

# Encoding
bs58             = "0.5.1"

# Randomness
rand             = "0.8.5"
getrandom        = "0.2.15"
hybrid-array     = "0.4"

# QR code generation (bootstrap contact codes)
qrcode           = "0.14"

# Passphrase strength
zxcvbn           = "3.1.0"

# Async primitives (oneshot channels for delivery confirmation)
tokio            = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
