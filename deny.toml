[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Deny any advisory that has a published CVE/RUSTSEC ID; ignore none by default.
yanked = "deny"

[licenses]
version = 2
# Only these SPDX identifiers are permitted across the entire dependency tree.
# Any crate with a license not in this list will cause the build to fail.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # op4 itself is AGPL-3.0-or-later
    "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # op4 uses pure-Rust crypto — ban any OpenSSL or native TLS bindings.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
