[package]
name = "op4-tui"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false
description = "Terminal UI for op4 secure messenger"
repository = "https://github.com/Opfour/op4"
authors = ["David Singer"]

[lib]
name = "op4_tui"
path = "src/lib.rs"

[[bin]]
name = "op4"
path = "src/main.rs"

[dependencies]
op4-core = { version = "0.3.1", path = "../op4-core" }

# Tor transport
tokio            = { version = "1.50.0", features = ["rt-multi-thread", "sync", "time", "io-util", "net", "fs", "macros"] }
hkdf             = "0.13"
sha2             = "0.11"

# TUI
ratatui          = "0.30.0"
crossterm        = "0.29.0"

# Randomness (cover traffic)
rand             = "0.8.5"

# Serialization (NymClient uses postcard for wire messages)
serde            = { version = "1.0.197", features = ["derive"] }
postcard         = { version = "1.1.3", features = ["alloc"] }

# Encoding (contact code display)
bs58             = "0.5.1"

# QR code display
qrcode           = "0.14"

# Passphrase strength (UI display)
zxcvbn           = "3.1.0"

# Key types needed for vault interaction
x25519-dalek     = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
zeroize          = { version = "1.8.2", features = ["derive", "serde"] }

# OS hardening
seccompiler      = "0.5.0"
libc             = "0.2.153"

[dev-dependencies]
insta            = "1"
tempfile         = "3"

[build-dependencies]
sha2             = "0.11"
walkdir          = "2.5.0"
