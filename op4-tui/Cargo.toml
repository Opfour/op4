[package]
name = "op4-tui"
version = "0.2.0-dev"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "op4"
path = "src/main.rs"

[dependencies]
op4-core = { path = "../op4-core" }

# Tor transport
tokio            = { version = "1.50.0", features = ["rt-multi-thread", "sync", "time", "io-util", "net", "fs", "macros"] }
hkdf             = "0.12.4"
sha2             = "0.10.8"

# TUI
ratatui          = "0.30.0"
crossterm        = "0.29.0"

# Randomness (cover traffic)
rand             = "0.8.5"

# Serialization (NymClient uses postcard for wire messages)
serde            = { version = "1.0.197", features = ["derive"] }
postcard         = { version = "1.1.3", features = ["alloc"] }

# Encoding (contact code display)
bs58             = "0.5.1"

# QR code display
qrcode           = "0.14"

# Passphrase strength (UI display)
zxcvbn           = "3.1.0"

# Key types needed for vault interaction
x25519-dalek     = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
zeroize          = { version = "1.8.2", features = ["derive", "serde"] }

# OS hardening
seccompiler      = "0.5.0"
libc             = "0.2.153"

[build-dependencies]
sha2             = "0.10.8"
walkdir          = "2.5.0"
