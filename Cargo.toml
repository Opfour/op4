[package]
name = "op4"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
# Post-quantum cryptography (RustCrypto)
ml-kem           = { version = "0.2.3", features = ["zeroize"] }
ml-dsa           = { version = "0.1.0-rc.7", features = ["zeroize"] }

# Classical cryptography — stable 2.x series (pre.6 is not stable API)
x25519-dalek     = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
ed25519-dalek    = { version = "2.1.1", features = ["rand_core", "zeroize"] }

# Symmetric crypto — stable series (ml-dsa may pull RC versions as transitive deps;
# Cargo resolver 2 handles parallel versions cleanly)
chacha20poly1305 = "0.10.1"
hkdf             = "0.12.4"
hmac             = "0.12.1"
sha2             = "0.10.8"
argon2           = "0.5.3"
zeroize          = { version = "1.8.2", features = ["derive", "serde"] }

# Nym transport
# NOTE: nym-sdk 1.20.4 has an internal compilation bug (nym-noise 1.20.4
# references VersionedNoiseKey which doesn't exist in nym-noise-keys 1.20.4).
# The NymClient is a well-defined stub with channel infrastructure ready.
# Re-add nym-sdk once a version that compiles cleanly is published:
#   nym-sdk = "<fixed-version>"
# Until then, the network layer uses std::sync::mpsc channels internally.
tokio            = { version = "1.50.0", features = ["rt-multi-thread", "sync", "time", "io-util", "net", "fs", "macros"] }

# TUI
ratatui          = "0.30.0"
crossterm        = "0.29.0"

# Serialization (minimal, no_std-friendly)
serde            = { version = "1.0.197", features = ["derive"] }
postcard         = { version = "1.1.3", features = ["alloc"] }

# Encoding
bs58             = "0.5.1"

# Randomness — stable 0.8.x for broad nym-sdk ecosystem compat
rand             = "0.8.5"
getrandom        = "0.2.15"
# Needed to name the seed-array type accepted by ml-dsa::KeyGen::from_seed.
# Already a transitive dependency of ml-kem and ml-dsa; pinning here makes it
# explicit and ensures the same resolved version is used throughout.
hybrid-array     = "0.4"

# QR code generation (bootstrap contact codes)
qrcode           = "0.14"

# Passphrase strength
zxcvbn           = "3.1.0"

# OS hardening
seccompiler      = "0.5.0"
libc             = "0.2.153"

[build-dependencies]
sha2             = "0.10.8"
walkdir          = "2.5.0"

[dev-dependencies]
tempfile = "3"
# Note: resolver = "2" is the default for edition 2021 packages
