name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SOURCE_DATE_EPOCH: "0"

jobs:
  # ── Test + Clippy ────────────────────────────────────────────────────────────
  test:
    name: Test & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  # ── Security Audit ───────────────────────────────────────────────────────────
  audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0436

  # ── Dependency Policy ────────────────────────────────────────────────────────
  deny:
    name: Dependency Policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check
          arguments: --all-features

  # ── Reproducible Build ───────────────────────────────────────────────────────
  reproducible-build:
    name: Reproducible Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build 1 (release, locked, deterministic timestamp)
        run: SOURCE_DATE_EPOCH=0 cargo build --release --locked

      - name: Record hash of build 1
        run: sha256sum target/release/op4 | tee /tmp/build1.sha256

      - name: Clean and rebuild (build 2)
        run: |
          cargo clean
          SOURCE_DATE_EPOCH=0 cargo build --release --locked

      - name: Record hash of build 2
        run: sha256sum target/release/op4 | tee /tmp/build2.sha256

      - name: Verify builds are identical
        run: diff /tmp/build1.sha256 /tmp/build2.sha256 && echo "✓ Reproducible build verified"

      - name: Verify README release hash is current
        run: |
          VERSION=$(grep '^version' op4-tui/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          BINARY_HASH=$(./target/release/op4 --print-hash)
          EXPECTED_ROW="| \`${VERSION}\` | \`${BINARY_HASH}\` |"
          if grep -qF "| \`${VERSION}\` | \`${BINARY_HASH}\` |" README.md; then
            echo "✓ README hash for v${VERSION} matches binary (${BINARY_HASH})"
          else
            echo "✗ README hash for v${VERSION} is missing or outdated."
            echo "  Binary hash : ${BINARY_HASH}"
            echo "  Run this and commit the result:"
            echo "    bash scripts/update-release-hash.sh"
            exit 1
          fi
