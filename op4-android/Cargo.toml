[package]
name = "op4-android"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
op4-core = { path = "../op4-core" }
libc = "0.2"
getrandom = "0.2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
arti-client = { version = "0.40", default-features = false, features = [
    "tokio",
    "rustls",
    "onion-service-client",
    "onion-service-service",
] }
tor-rtcompat = { version = "0.40", features = ["tokio", "rustls"] }
tor-hsservice = "0.40"
tor-cell = "0.40"
safelog = "0.8"
futures = "0.3"
rand = "0.8"
hkdf = "0.12"
sha2 = "0.10"

eframe = { version = "0.33", features = ["wgpu"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false }
zxcvbn = "3"
postcard = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
